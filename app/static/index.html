<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .sidebar { background: linear-gradient(120deg, #334155 0%, #1e293b 100%); }
        .user-bubble { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .ai-bubble { background: linear-gradient(135deg, #1e3a8a, #0f172a); border: 1px solid rgba(99, 102, 241, 0.3); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
        .chat-window { scroll-behavior: smooth; max-height: calc(100vh - 240px); }
        .hljs { background: #1e293b !important; border-radius: 12px !important; padding: 1.25rem !important; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4b5563; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div class="sidebar w-80 flex flex-col p-4 border-r border-gray-800/50">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold">Agent AI</h2>
                <div>
                    <button id="clear-chat-btn" title="Clear Chat">🗑️</button>
                    <button id="new-chat-btn" title="New Chat">+</button>
                </div>
            </div>
            <div id="chat-list" class="flex-1 overflow-y-auto pr-2 space-y-2">
                <!-- Chat list will be dynamically populated here -->
            </div>
            <div class="mt-auto pt-4 border-t border-gray-800/50">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-lg font-semibold">Operator Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="operator-mode-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <select id="model-selector" class="w-full bg-gray-700/50 border border-gray-600 rounded-lg p-2 text-sm"></select>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <div id="chat-window" class="chat-window flex-1 overflow-y-auto p-6 space-y-6">
                <!-- Messages will be dynamically populated here -->
            </div>
            <div class="p-4 bg-gray-900/50 border-t border-gray-800/50">
                <div class="flex justify-center gap-3 mb-3">
                    <button id="stop-agent-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-xl hidden">Stop Agent</button>
                </div>
                <div class="flex items-end space-x-3">
                    <textarea id="message-input" placeholder="Ask a question or give a task..." class="flex-1 bg-gray-800/50 border rounded-xl p-4 resize-none"></textarea>
                    <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/js/libs/marked.min.js"></script>
    <script src="/static/js/libs/highlight.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
