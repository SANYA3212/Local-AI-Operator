<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app-container">
        <div id="sidebar">
            <div id="sidebar-header">
                <h2>Chats</h2>
                <div>
                    <button id="clear-chat-btn" title="Clear current chat">🗑️</button>
                    <button id="new-chat-btn" title="New chat">+</button>
                </div>
            </div>
            <div id="settings-container">
                <label class="switch">
                    <input type="checkbox" id="theme-switcher">
                    <span class="slider round"></span>
                </label>
                <span>Dark Mode</span>
            </div>
            <div id="chat-list">
                <!-- Chat list will be populated here -->
            </div>
            <div id="model-selector-container">
                <label for="model-selector">Model:</label>
                <select id="model-selector">
                    <!-- Models will be populated here -->
                </select>
            </div>
            <div id="status-bar">
                <div id="tps-counter">TPS: 0.0</div>
                <div id="lang-switcher">
                    <button data-lang="en">EN</button> | <button data-lang="ru">RU</button>
                </div>
            </div>
        </div>
        <div id="main-content">
            <div id="chat-window">
                <!-- Messages will be displayed here -->
            </div>
            <div id="input-container">
                <textarea id="message-input" placeholder="Type your message or use the buttons below..."></textarea>
                <button id="send-btn">Send</button>
            </div>
            <div id="action-buttons-container">
                <button class="action-btn" data-action="write_file">Write File</button>
                <button class="action-btn" data-action="shell_command">Run Command</button>
                <button class="action-btn" data-action="take_screenshot">Take Screenshot</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Use local libraries to fix the "marked is not defined" error -->
    <script src="/static/js/libs/marked.min.js"></script>
    <script src="/static/js/libs/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
